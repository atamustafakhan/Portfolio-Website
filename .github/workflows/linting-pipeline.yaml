name: Linting Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install htmlhint stylelint stylelint-config-standard --save-dev
      - run: npx htmlhint "**/*.html"
      - run: npx stylelint "**/*.css"